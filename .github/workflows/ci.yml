name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        # No live API is called: every test runs against committed fixtures (spec §60).
        run: npm test
      - name: Rebuild demo dataset and check it is committed
        run: |
          npm run data:demo
          git diff --exit-code --stat apps/web/public/data/demo-dataset.json \
            || (echo "demo-dataset.json is out of date; run npm run data:demo" && exit 1)
      - name: Build web
        run: npm run build
      - name: Build gateway
        run: npm run build:gateway

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test e2e/smoke.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
