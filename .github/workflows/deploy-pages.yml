name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh the PLATEAU manifest from the official catalog
        # Runners have open network, so Pages gets catalog-verified tileset URLs.
        # Non-fatal: the builder keeps the committed manifest if the catalog is down,
        # and refuses to downgrade a catalog-derived manifest to a pattern-derived one.
        continue-on-error: true
        run: npm run data:plateau

      - name: Build
        # No gateway URL is set here on purpose: the public build runs in DEMO MODE
        # with no credentials of any kind (spec §43). Set VITE_GATEWAY_URL as a
        # repository variable to publish a LIVE build instead.
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_GATEWAY_URL: ${{ vars.VITE_GATEWAY_URL }}
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
